name: Apply ORBIT dashboard time fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-dashboard-time:
    if: ${{ !contains(github.event.head_commit.message, '[skip orbit time fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update dashboard metric
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')

          # Find the compact metric declaration by its stable variable names.
          start = re.search(r"const\s+done\s*=", text)
          end = re.search(r"\bconst\s+visibleTasks\s*=", text)
          if not start or not end or end.start() <= start.start():
              raise SystemExit('Could not locate dashboard metric block')

          new_block = "const done=tasks.filter(t=>t.status==='Done').length, progress=tasks.length?Math.round(done/tasks.length*100):0; const today=localDateKey(new Date()); const dueToday=tasks.filter(t=>t.due_date===today&&t.status!=='Done').length; const todayMinutes=sessions.filter(s=>s.session_date===today).reduce((a,b)=>a+(Number(b.minutes)||0),0); const hours=Math.round((sessions.reduce((a,b)=>a+(Number(b.minutes)||0),0)/60)*10)/10; const todayHours=Math.round((todayMinutes/60)*10)/10;\n "
          text = text[:start.start()] + new_block + text[end.start():]

          candidates = re.findall(r"<Stat\s+icon=\{Clock3\}[^>]*?/>", text)
          target = next((x for x in candidates if 'Time logged' in x), None)
          if not target:
              raise SystemExit('Could not locate Time logged dashboard card')

          new_card = '<Stat icon={Clock3} label="Time logged today" value={p.todayHours+\'h\'} sub="today\'s sessions" detail="View daily history" onClick={()=>p.setTab(\'Focus\')} accent="cyan"/>'
          text = text.replace(target, new_card, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git rm .github/workflows/orbit-time-logged-today.yml
          git commit -m "Show time logged today on dashboard [skip orbit time fix]"
          git push
