name: Apply ORBIT dashboard time fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-dashboard-time:
    if: ${{ !contains(github.event.head_commit.message, '[skip orbit time fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update dashboard metric
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')

          old_calc = "const done=tasks.filter(t=>t.status==='Done').length, progress=tasks.length?Math.round(done/tasks.length*100):0; const today=localDateKey(new Date()); const dueToday=tasks.filter(t=>t.due_date===today&&t.status!=='Done').length; const hours=Math.round((sessions.reduce((a,b)=>a+b.minutes,0)/60)*10)/10;"
          new_calc = "const done=tasks.filter(t=>t.status==='Done').length, progress=tasks.length?Math.round(done/tasks.length*100):0; const today=localDateKey(new Date()); const dueToday=tasks.filter(t=>t.due_date===today&&t.status!=='Done').length; const todayMinutes=sessions.filter(s=>s.session_date===today).reduce((a,b)=>a+(Number(b.minutes)||0),0); const hours=Math.round((sessions.reduce((a,b)=>a+(Number(b.minutes)||0),0)/60)*10)/10; const todayHours=Math.round((todayMinutes/60)*10)/10;"

          old_card = '<Stat icon={Clock3} label="Time logged" value={p.hours+\'h\'} sub="all-time sessions" detail="Open focus timer" onClick={()=>p.setTab(\'Focus\')} accent="cyan"/>'
          new_card = '<Stat icon={Clock3} label="Time logged today" value={p.todayHours+\'h\'} sub="today\'s sessions" detail="View daily history" onClick={()=>p.setTab(\'Focus\')} accent="cyan"/>'

          if text.count(old_calc) != 1:
              raise SystemExit(f'Expected exactly 1 dashboard calculation, found {text.count(old_calc)}')
          if text.count(old_card) != 1:
              raise SystemExit(f'Expected exactly 1 dashboard card, found {text.count(old_card)}')

          text = text.replace(old_calc, new_calc)
          text = text.replace(old_card, new_card)
          path.write_text(text, encoding='utf-8')

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orbit-time-logged-today.yml
          git add src/main.jsx
          git commit -m "Fix dashboard time logged today [skip orbit time fix]"
          git push
